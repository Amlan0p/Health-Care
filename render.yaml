# Render Blueprint: New -> Blueprint -> connect this GitHub repo.
# Creates one web service (API + static frontend) and one PostgreSQL database.
services:
  - type: web
    name: healthcare-app
    runtime: node
    region: singapore
    plan: free
    # Keep the repository root as the build context so backend can serve ../frontend.
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: ENABLE_DEMO
        value: "true"

databases:
  - name: healthcare-db
    region: singapore
    plan: free
