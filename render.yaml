# Render Blueprint — one web service (API + frontend) and one managed PostgreSQL database.
# Docs: https://render.com/docs/blueprint-spec
#
# NO secrets live in this file:
#   - JWT_SECRET is generated by Render (generateValue).
#   - GROQ_API_KEY is entered by you in the Render dashboard (sync: false).
#   - DATABASE_URL is injected from the database below.
#
# PLAN NOTE: Render's *free* Postgres instances expire after 30 days (verify current terms on render.com/pricing).
# This blueprint therefore uses a paid database plan so health data is not deleted. For a throw-away trial you may
# change `plan` to `free`, but do not store real data there.

databases:
  - name: healthcare-db
    plan: free
    region: oregon
    databaseName: healthcare
    user: healthcare

services:
  - type: web
    name: healthcare-app
    runtime: node
    region: oregon            # must match the database region (the internal DATABASE_URL only resolves in-region)
    plan: free                # free web services sleep after ~15 min idle; upgrade for always-on
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false           # paste your NEW Groq key in the dashboard; never commit it
      # Optional (add manually in the dashboard only if the frontend is hosted on a DIFFERENT origin): FRONTEND_ORIGIN
      - key: ENABLE_DEMO
        value: "true"
