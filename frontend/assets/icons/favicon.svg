<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="hcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="hcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Modern medical badge squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#hcGrad)" filter="url(#hcGlow)" />
  <rect x="5.5" y="5.5" width="53" height="53" rx="14.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />
  
  <!-- Clinical Cross Silhouette (Subtle White Glow) -->
  <path d="M26 15h12v11h11v12h-11v11h-12v-11h-11v-12h11v-11z" fill="#ffffff" fill-opacity="0.18" />

  <!-- Dynamic Precision ECG Wave through Center -->
  <path d="M12 32h11l3-7 5 15 5-11 3 3h13" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Live Pulse Dot -->
  <circle cx="52" cy="32" r="2.5" fill="#ffffff" />
</svg>
